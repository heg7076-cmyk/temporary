<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나의 칸반 보드</title><style>
:root{--bg:#f5f5f2;--ink:#232d29;--muted:#626d67;--line:#dce2db;--green:#236348}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,'Apple SD Gothic Neo','Nanum Gothic',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink);padding:10px 14px}button:hover{background:#edf1ec}button:focus-visible,input:focus,textarea:focus,select:focus{outline:3px solid #a0cbb4;outline-offset:2px}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover{background:#194f38}.shell{max-width:1440px;margin:auto;padding:36px 38px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.eyebrow{font-size:12px;color:var(--green);font-weight:800;letter-spacing:2px}h1{font-size:32px;margin:8px 0}p{color:var(--muted);line-height:1.6}.actions,.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.stats{display:flex;gap:28px;margin:28px 0;border-block:1px solid var(--line);padding:20px 0}.stats strong{font-size:24px;margin-right:8px}.stats span{color:var(--muted);font-size:13px}.filters{margin:24px 0}.filters input{flex:1;min-width:180px}.filters input,.filters select,dialog input,dialog select,dialog textarea{border:1px solid var(--line);border-radius:8px;padding:11px;background:white;color:var(--ink)}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:start}.column{background:#eceedf55;border:1px solid var(--line);border-radius:15px;padding:16px;min-height:380px}.column[data-status="doing"]{background:#eaf0ed}.column[data-status="done"]{background:#eeeff1}.column.over{outline:2px dashed var(--green);background:#dfebe2}.column-head{display:flex;align-items:center;gap:8px;margin-bottom:18px}.dot{width:9px;height:9px;border-radius:50%;background:#9b8655}.doing .dot{background:#41816a}.done .dot{background:#7a8594}h2{font-size:16px;margin:0}.count{font-size:12px;color:var(--muted);background:#ffffffaa;padding:3px 8px;border-radius:20px}.add-small{margin-left:auto;padding:3px 10px;font-size:22px;background:transparent;border:0}.cards{min-height:260px}.card{padding:17px;background:white;border:1px solid #e0e4df;border-radius:11px;margin-bottom:12px;box-shadow:0 3px 8px #273d2910;cursor:grab;overflow-wrap:anywhere}.card:active{cursor:grabbing}.card h3{font-size:16px;line-height:1.5;margin:12px 0 8px}.card p{font-size:13px;margin:0 0 14px;white-space:pre-wrap}.card-top,.card-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px}.badge{font-size:11px;font-weight:700;padding:4px 8px;border-radius:5px;background:#edf0ee;color:#49574d}.high{background:#fff0ea;color:#974522}.low{background:#eef2fb;color:#4b6090}.date{font-size:12px;color:var(--muted)}.late{color:#a23a28}.edit{border:0;padding:2px 6px;font-size:12px;color:var(--muted)}.move{border:0;border-top:1px solid #eff1ee;margin-top:14px;padding-top:10px;display:flex;gap:6px;justify-content:flex-end}.move button{font-size:11px;padding:4px 7px}.empty{text-align:center;color:var(--muted);font-size:13px;padding:45px 8px;line-height:1.8}.foot{font-size:12px;color:var(--muted);margin-top:22px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}dialog{border:1px solid var(--line);border-radius:16px;padding:26px;width:min(510px,calc(100% - 30px));max-height:90vh;overflow:auto;color:var(--ink);box-shadow:0 20px 80px #0003}dialog::backdrop{background:#14291e66}dialog h2{font-size:22px;margin-bottom:22px}label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}dialog input,dialog textarea,dialog select{width:100%}textarea{resize:vertical;min-height:110px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}.danger{color:#a23a28;margin-right:auto}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#233e30;color:white;padding:12px 20px;border-radius:10px;box-shadow:0 5px 20px #0002;z-index:5;max-width:90%;font-size:13px}#toast:empty{display:none}@media(max-width:800px){.shell{padding:24px 18px}.top{align-items:flex-start;flex-direction:column}.board{grid-template-columns:1fr}.column{min-height:180px}.cards{min-height:90px}.stats{gap:20px;flex-wrap:wrap}.stats strong{font-size:21px}h1{font-size:28px}}
</style></head><body><main class="shell"><header class="top"><div><div class="eyebrow">MY PERSONAL WORKSPACE</div><h1>나의 칸반 보드</h1><p style="margin:6px 0">머릿속 할 일을 꺼내고, 하나씩 앞으로.</p></div><div class="actions"><button id="export">백업 내보내기</button><button id="import">백업 불러오기</button><button class="primary" id="new">＋ 할 일 추가</button></div></header><section class="stats" aria-label="전체 현황"><div><strong id="total">0</strong><span>전체 할 일</span></div><div><strong id="active">0</strong><span>진행 중</span></div><div><strong id="complete">0%</strong><span>완료율</span></div></section><section class="filters" aria-label="검색과 필터"><input id="search" type="search" placeholder="제목이나 메모 검색…" aria-label="할 일 검색"><select id="priorityFilter" aria-label="우선순위 필터"><option value="">모든 우선순위</option value="high">높음</option><option value="normal">보통</option><option value="low">낮음</option></select><select id="sort" aria-label="정렬"><option value="created">최근 추가순</option><option value="due">마감일순</option><option value="priority">우선순위순</option></select></section><section class="board" aria-label="칸반 보드"></section><footer class="foot"><span>카드를 끌어 옮기거나 카드 아래 이동 버튼을 사용하세요.</span><span id="saveState" role="status">이 브라우저에 자동 저장 · 외부 전송 없음</span></footer></main><dialog id="editor"><form id="taskForm"><h2 id="dialogTitle">새 할 일</h2><label for="title">제목 *</label><input id="title" required maxlength="160" placeholder="어떤 일을 할까요?" autocomplete="off"><label for="notes">메모</label><textarea id="notes" maxlength="10000" placeholder="필요한 내용이나 체크할 사항을 적어보세요."></textarea><div class="row"><div><label for="status">상태</label><select id="status"><option value="todo">할 일</option><option value="doing">진행 중</option><option value="done">완료</option></select></div><div><label for="priority">우선순위</label><select id="priority"><option value="normal">보통</option><option value="high">높음</option><option value="low">낮음</option></select></div></div><label for="due">마감일 (선택)</label><input id="due" type="date"><div class="dialog-actions"><button type="button" class="danger" id="delete">삭제</button><button type="button" id="cancel">취소</button><button type="submit" class="primary">저장</button></div></form></dialog><input type="file" id="file" accept="application/json,.json" hidden><div id="toast" role="status" aria-live="polite"></div><script>
'use strict';
const $=id=>document.getElementById(id),KEY='personal-kanban-v1',states=[['todo','할 일'],['doing','진행 중'],['done','완료']],priorities={high:'높음',normal:'보통',low:'낮음'};let tasks=[],editing=null,dragging=null,timer;
function notify(text){$('toast').textContent=text;clearTimeout(timer);timer=setTimeout(()=>$('toast').textContent='',3800)}
function validTask(t){return t&&typeof t.id==='string'&&typeof t.title==='string'&&t.title.trim().length>0&&t.title.length<=160&&typeof t.notes==='string'&&t.notes.length<=10000&&states.some(s=>s[0]===t.status)&&Object.hasOwn(priorities,t.priority)&&typeof t.due==='string'&&(t.due===''||(/^\d{4}-\d{2}-\d{2}$/.test(t.due)&&!isNaN(Date.parse(t.due))))&&typeof t.created==='number'&&Number.isFinite(t.created)}
try{const stored=localStorage.getItem(KEY);if(stored!==null){const a=JSON.parse(stored);if(!Array.isArray(a)||!a.every(validTask)||new Set(a.map(t=>t.id)).size!==a.length)throw Error();tasks=a}}catch(e){notify('저장 데이터를 읽지 못했습니다. 백업 파일을 확인해 주세요.');$('saveState').textContent='저장 데이터 읽기 실패 · 백업을 확인하세요'}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks));$('saveState').textContent='이 브라우저에 자동 저장 · 외부 전송 없음'}catch(e){$('saveState').textContent='자동 저장 실패 · 백업 내보내기를 사용하세요';notify('브라우저 저장 공간을 사용할 수 없습니다. 백업을 내보내 주세요.')}render()}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function move(id,status){const t=tasks.find(t=>t.id===id);if(t){t.status=status;save()}}
function render(){const query=$('search').value.toLocaleLowerCase().trim(),filter=$('priorityFilter').value;let visible=tasks.filter(t=>(!filter||t.priority===filter)&&(!query||(t.title+' '+t.notes).toLocaleLowerCase().includes(query)));const rank={high:0,normal:1,low:2};visible.sort((a,b)=>$('sort').value==='due'?((a.due||'9999').localeCompare(b.due||'9999')||b.created-a.created):$('sort').value==='priority'?(rank[a.priority]-rank[b.priority]||b.created-a.created):b.created-a.created);$('total').textContent=tasks.length;$('active').textContent=tasks.filter(t=>t.status==='doing').length;$('complete').textContent=(tasks.length?Math.round(tasks.filter(t=>t.status==='done').length/tasks.length*100):0)+'%';const board=document.querySelector('.board');board.replaceChildren();for(const [key,label] of states){const col=el('section','column '+key);col.dataset.status=key;col.setAttribute('aria-label',label);const list=visible.filter(t=>t.status===key),head=el('div','column-head');head.append(el('span','dot'),el('h2','',label),el('span','count',list.length));const add=el('button','add-small','＋');add.setAttribute('aria-label',label+'에 추가');add.onclick=()=>openEditor(null,key);head.append(add);col.append(head);const cards=el('div','cards');if(!list.length)cards.append(el('div','empty',query||filter?'조건에 맞는 할 일이 없어요.':'아직 카드가 없어요.\n＋ 버튼으로 추가해 보세요.'));for(const t of list){const card=el('article','card');card.draggable=true;card.addEventListener('dragstart',e=>{dragging=t.id;e.dataTransfer.setData('text/plain',t.id);e.dataTransfer.effectAllowed='move'});card.addEventListener('dragend',()=>{dragging=null;document.querySelectorAll('.over').forEach(n=>n.classList.remove('over'))});const top=el('div','card-top');top.append(el('span','badge '+t.priority,priorities[t.priority]));const edit=el('button','edit','수정');edit.setAttribute('aria-label',t.title+' 수정');edit.onclick=()=>openEditor(t);top.append(edit);card.append(top,el('h3','',t.title));if(t.notes)card.append(el('p','',t.notes));if(t.due){const late=t.status!=='done'&&t.due<today();card.append(el('div','date'+(late?' late':''),(late?'기한 지남 · ':'마감 · ')+t.due))}const controls=el('div','move');states.filter(s=>s[0]!==key).forEach(([s,l])=>{const b=el('button','',l+' →');b.setAttribute('aria-label',t.title+': '+l+'으로 이동');b.onclick=()=>move(t.id,s);controls.append(b)});card.append(controls);cards.append(card)}col.append(cards);col.addEventListener('dragover',e=>{if(dragging){e.preventDefault();e.dataTransfer.dropEffect='move';col.classList.add('over')}});col.addEventListener('dragleave',e=>{if(!col.contains(e.relatedTarget))col.classList.remove('over')});col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('over');if(dragging)move(dragging,key);dragging=null});board.append(col)}}
function openEditor(t,status='todo'){editing=t?t.id:null;$('taskForm').reset();$('dialogTitle').textContent=t?'할 일 수정':'새 할 일';$('title').value=t?t.title:'';$('notes').value=t?t.notes:'';$('status').value=t?t.status:status;$('priority').value=t?t.priority:'normal';$('due').value=t?t.due:'';$('delete').hidden=!t;$('editor').showModal();$('title').focus()}
$('new').onclick=()=>openEditor(null);$('cancel').onclick=()=>$('editor').close();$('taskForm').onsubmit=e=>{e.preventDefault();const title=$('title').value.trim();if(!title){$('title').focus();return}const data={title,notes:$('notes').value.trim(),status:$('status').value,priority:$('priority').value,due:$('due').value};if(editing){Object.assign(tasks.find(t=>t.id===editing),data)}else{tasks.push({id:globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2),created:Date.now(),...data})}save();$('editor').close();notify('저장했습니다.')};$('delete').onclick=()=>{if(confirm('이 할 일을 삭제할까요?')){tasks=tasks.filter(t=>t.id!==editing);save();$('editor').close();notify('삭제했습니다.')}};['search','priorityFilter','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),tasks},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='kanban-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('백업 파일을 내보냈습니다.')};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>10*1024*1024)throw Error();const data=JSON.parse(await file.text());if(data.version!==1||!Array.isArray(data.tasks)||!data.tasks.every(validTask)||new Set(data.tasks.map(t=>t.id)).size!==data.tasks.length)throw Error();if(confirm('현재 보드를 백업의 '+data.tasks.length+'개 할 일로 교체할까요? 현재 내용이 필요하면 먼저 백업해 주세요.')){tasks=data.tasks.map(t=>({id:t.id,title:t.title,notes:t.notes,status:t.status,priority:t.priority,due:t.due,created:t.created}));save();notify('백업을 불러왔습니다.')}}catch(err){notify('올바른 칸반 백업 파일이 아닙니다. (최대 10MB)')}finally{e.target.value=''}};window.addEventListener('storage',e=>{if(e.key===KEY)notify('다른 탭에서 보드가 변경되었습니다. 새로고침 후 사용하세요.')});render();
</script></body></html>
